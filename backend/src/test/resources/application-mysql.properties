# Profile kiểm thử tích hợp trên MySQL 8.0 thật (kích hoạt qua @ActiveProfiles("mysql") hoặc -Dspring.profiles.active=mysql)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:parttime_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:vlu-parttime-job-marketplace-secret-key-2026-sprint1-secure-256bit}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:7200}

