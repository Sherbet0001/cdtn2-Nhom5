# Profile kiểm thử tích hợp trên MySQL 8.0 thật (kích hoạt qua @ActiveProfiles("mysql") hoặc -Dspring.profiles.active=mysql)
spring.datasource.url=jdbc:mysql://localhost:3306/parttime_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

app.jwt.secret=vlu-parttime-job-marketplace-secret-key-2026-sprint1-secure-256bit
app.jwt.expiration-seconds=7200
