spring.application.name=parttime-marketplace

# Cấu hình kết nối CSDL MySQL 8.0 (Lấy từ biến môi trường, không lưu mật khẩu thật trong file)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:parttime_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tự động thực thi schema.sql (8 bảng) và data.sql (dữ liệu mẫu)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false

# Cấu hình JPA / Hibernate (defer-datasource-initialization=true để schema.sql chạy chuẩn với JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Cấu hình JWT (Thời hạn 2 giờ = 7200 giây theo QT-AUTH, lấy từ biến môi trường JWT_SECRET)
app.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-key-minimum-32-chars-for-local-sprint1}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:7200}

# Cấu hình Swagger UI (springdoc-openapi)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
