server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: partjob
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/partjob_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Chi dung cho dev. Khi chay that phai dat bien moi truong JWT_SECRET (>= 32 ky tu).
    secret: ${JWT_SECRET:dev-only-secret-change-me-partjob-nhom5-0123456789abcdef}
    expiration-seconds: 7200
  admin:
    # Tai khoan ADMIN duoc nap san khi chua co (FR-04). Doi mat khau khi chay that.
    email: ${ADMIN_EMAIL:admin@partjob.local}
    password: ${ADMIN_PASSWORD:Admin@12345}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
